name: Build and Release

on:
  push:
    tags:
      - 'v*' # This tells GitHub to ONLY run this script when you push a version tag like "v1.0.0"

jobs:
  release:
    # This is the "Matrix Strategy" that solves your cross-compilation issue!
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # You can change this to match the Node version you use locally

      - name: Install dependencies
        run: npm install

      - name: Build Frontend (Vite/React)
        run: npm run build 

      - name: Build and Publish Electron app
        run: npx electron-builder --publish always
        env:
          # GitHub automatically generates this token to securely upload your .exe and .dmg
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}